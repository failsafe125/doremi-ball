name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DoReMiBall.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DoReMiBall
          path: DoReMiBall.apk

      # Publishes the APK at a fixed link: <repo>/releases/latest
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DoReMiBall.apk \
            --title "Do Re Mi Ball (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. Download DoReMiBall.apk on your phone and open it to install." \
            --target "${{ github.sha }}"
